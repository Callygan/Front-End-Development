<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Responsive Menu</title>
<style>
/* HIDE mobile menu on desktop */
.desktop-nav {
  display: flex;
  gap: 20px;
}

.logo {
  font-size: 20px;
  font-weight: 600;
  color: #0f001a;
  text-decoration: none;
}

/* MOBILE — show menu icon (logo) only */
@media (max-width: 768px) {
  .desktop-nav {
    display: none;
  }

  .logo {
    display: block;
  }
}

/* ===== FULLSCREEN MOBILE MENU ===== */

.mobile-menu {
  position: fixed;
  top: -100%;
  left: 0;
  width: 100%;
  height: auto;
  background: linear-gradient(to bottom, #ffe4d6, #ffffff);
  padding: 40px 0;
  text-align: center;
  z-index: 999;
  transition: top 0.4s ease;
}

/* MENU ITEMS */
.mobile-menu .menu-item {
  display: block;
  padding: 18px 0;
  font-size: 20px;
  color: #0f001a;
  text-decoration: none;
}

.mobile-menu .menu-item.active {
  background-color: #cc5520;
  color: #fff;
}

/* CLOSE BUTTON */
.close-menu {
  display: block;
  font-size: 40px;
  text-decoration: none;
  color: #0f001a;
  margin-bottom: 20px;
}

/* ===== SHOW MENU ON TARGET (CSS ONLY) ===== */
#menu:target {
  top: 70px; /* EXACT sub logo */
}

/* ===== BLUR BACKGROUND WHEN MENU OPEN ===== */
#menu-blur {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  backdrop-filter: blur(10px);
  background: rgba(0, 0, 0, 0.4);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  z-index: 998;
}

#menu:target ~ #menu-blur {
  opacity: 1;
  pointer-events: auto;
}

/* ===== DESKTOP MENU STYLE ===== */

.desktop-nav a {
  text-decoration: none;
  color: #0f001a;
  font-size: 16px;
}

.desktop-nav a.active {
  color: #cc5520;
}

</style>
</head>

<body>

<header>
  <div class="nav-bar">
    <a href="#menu" class="logo">foxminded</a>

    <nav class="desktop-nav">
      <a href="#">Home</a>
      <a href="#" class="active">About</a>
      <a href="#">Contact Us</a>
    </nav>
  </div>
</header>

<!-- ✦ Mobile Fullscreen Menu (CSS ONLY) -->
<div id="menu" class="mobile-menu">
    <a href="#" class="menu-item">Home</a>
    <a href="#" class="menu-item active">About</a>
    <a href="#" class="menu-item">Contact Us</a>
    <a href="#" class="close-menu">×</a>
</div>

<!-- Blur Overlay -->
<div id="menu-blur"></div>


<section style="padding: 40px; font-size: 22px; color: #444;">
  Scroll content... (just placeholder)
</section>

</body>
</html>
