<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>ToDo List</title>
</head>
<body>

    <div class="container">
        <div class="todo-app">
        <div class="todo-header">
            <input type="text" id="taskInput" placeholder="Type here to add a task..." />
            <button id="addBtn">+ Add</button>
        </div>
    </div>

    <ul id="todoList"></ul>
    </div>
    
    

    <button id="clearAll" class="clear-btn"><img src="images/trash-icon.png" alt="Trach Icon">Clear all tasks</button>


    <script src="js/script.js"></script>
</body>
</html>
