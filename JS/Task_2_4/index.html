<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <title>Form</title>
</head>
<body>
    <div class="header-container">
        <header>
            <h1>Create Account</h1>
            <img src="images/fox_header.png" alt="Fox image">
        </header>
    </div>
    <main>
        <form action="#" method="post">
            <!-- Name Container -->
                <div class="fname">
                    <label for="fname"> First name*</label>
                    <input type="text" id="fname" name="fname" placeholder="Enter your first name" required>
                </div>
                <div class="lname">
                    <label for="lname"> Last name*</label>
                    <input type="text" id="lname" name="lname" placeholder="Enter your last name" required>
                </div>
            
             <!-- Email -->
            <div class="email-container">
                <label for="email"> Email*</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <!-- Password -->
                <div class="password">
                    <label for="password"> Password*</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                
                <div class="cpassword">
                    <label for="confirm-password"> Confirm password*</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Repeat password" required>
                </div>
            
            <!-- Gender -->
            <div class="gender-container">
                <label>Gender:</label>
                <div class="gender-options">
                    <label><input type="radio" name="gender" value="male">Male</label>
                    <label><input type="radio" name="gender" value="female">Female</label>
                </div>
            </div>
            
            <!-- Hobbies -->
            <div class="hobbies-container">
                <label>Hobbies:</label>
                <div class="hobbies-options">
                    <label><input type="checkbox" id="music" name="hobbies" value="music">Music</label>
                    <label><input type="checkbox" id="sport" name="hobbies" value="sport">Sport</label>
                    <label><input type="checkbox" id="mtravel" name="hobbies" value="travel">Travel</label>
                    <label><input type="checkbox" id="movie" name="hobbies" value="movie">Movie</label>
                </div>
            </div>
            

            <!-- Source of Income -->
            <div class="income-container">
                <label for="income-source">Source of Income:</label>
                <select id="income-source" name="income-source">
                    <option value="employed" selected>Employed</option>
                    <option value="self-employed" >Self-employed</option>
                    <option value="student">Student</option>
                    <option value="unemployed">Unemployed</option>
                </select>
            </div>
             
             <!-- Income Slider -->
            <div class="slider-container">
                <label for="income">Income:</label>
                <div class="slider-value">
                    <input type="range" id="income" name="income" min="0" max="100000" step="1000" value="50000">
                    <span id="income-value">20K</span>
                </div>
            </div>
            

            <!-- Updload Profile Picture -->
            <div class="upload-container">
                <label for="profile-pic">Upload Profile Picture:</label>
                <input type="file" id="profile-pic" name="profile-pic" accept="image/*">
            </div>
            
            <!-- Age -->
            <div class="age-container">
                <label for="age"> Age:</label>  
                <input type="number" id="age" name="age" min="0" max="120" value="25">
            </div>

            
            <!-- Bio -->
            <div class="bio-container">
                <label for="bio"> Bio:</label>
                <textarea id="bio" name="bio" placeholder="Tell about yourself..."></textarea>
            </div>

            <!-- Submit Button -->
             <button type="submit">Create</button>
        </form>
    </main>

    
    <script src="js/script.js"></script>
    <script src="js/validation.js"></script>
</body>
</html>
